[package]
name = "epher-tui"
version = "0.5.28"
edition = "2021"
license = "MIT"
description = "Native full-screen terminal frontend."

[[bin]]
name = "epher-tui"
path = "src/main.rs"

[dependencies]
epher-core = { path = "../core" }
epher-shell = { path = "../shell" }
epher-store = { path = "../store", features = ["fs"] }
epher-i18n = { path = "../i18n" }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
sys-locale = "0.3"
epher-guide = { path = "../guide" }

[dev-dependencies]
tempfile = "3"
ratatui = "0.29"
