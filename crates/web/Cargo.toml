[package]
name = "epher-web"
version = "0.5.16"
edition = "2021"
license = "MIT"
description = "Yew frontend compiled to wasm32-unknown-unknown — shared by the PWA and the Tauri shell."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
epher-core = { path = "../core" }
epher-shell = { path = "../shell" }
epher-store = { path = "../store" }
epher-i18n = { path = "../i18n" }
epher-guide = { path = "../guide" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
gloo-events = "0.2"
gloo-render = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Blob", "DomRect", "File", "FileList", "HtmlAnchorElement", "HtmlInputElement", "Storage", "Url", "HtmlTextAreaElement", "HtmlFormElement", "HtmlElement", "Window", "Navigator", "Element", "MouseEvent", "KeyboardEvent", "MediaQueryList", "Clipboard", "console", "ShareData", "UrlSearchParams", "History", "Location", "DomTokenList", "PointerEvent", "WheelEvent", "Touch", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Response"] }
