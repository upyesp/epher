# Build the unified epher installers for every platform and attach them to
# a GitHub Release. Triggered by pushing a tag:
#   git tag v0.4.1 && git push origin v0.4.1
#
# One download per platform (ADR-0011): each installer carries the unified
# `epher` executable — one-shot CLI, REPL (`epher repl`), piped scripts
# (`epher -`), TUI (`epher tui`), and the desktop GUI (bare `epher` /
# `epher gui`). Windows installs two subsystem builds of the same program
# (console `epher.exe` on PATH; GUI-subsystem `epher-gui.exe` as the
# double-click target — no console flash); macOS/Linux install the single
# binary. On Windows the NSIS installer adds the install directory to the
# user PATH (nsis-hooks.nsh), and a hook Files the console build next to
# the GUI main binary — `bundle.resources` cannot (tauri-build copies
# resources during cargo build, before the sibling binary exists).
#
# Asset names (stable — the landing page links to these):
#   epher-windows-x86_64.exe        Windows installer (NSIS)
#   epher-macos-aarch64.dmg         macOS disk image (Apple Silicon only —
#                                   ADR-0025 dropped the Intel build)
#   epher-linux-x86_64.deb          Debian/Ubuntu and derivatives
#   epher-linux-x86_64.rpm          Fedora/RHEL and derivatives
#   epher-linux-x86_64.AppImage     everything else, incl. Arch — runs as-is
#   epher-linux-aarch64.*           the same three, ARM64 (ADR-0061)
#
# The repositories and stores (ADR-0061): the linux-repos job serves the
# same debs/rpms from epher.org's apt and dnf repositories (GitHub Pages,
# GPG-signed, container install-smoke before publish); the snap job
# repacks the release deb for the Snap Store; the store-bumps job commits
# version bumps to the Flathub manifest. Each of
# those jobs skips with a notice when its credentials (GPG key, Snap
# Store login, Flathub deploy key) are not yet configured.
#
# The builds carry no developer identity: Windows is unsigned, macOS is
# ad-hoc signed (a valid signature, so Gatekeeper's "damaged" check
# passes) — first launch shows the ordinary overridable warning, and the
# guide documents the right-click → Open path for each OS.
#
# The Linux legs pin ubuntu-22.04 and ubuntu-22.04-arm (glibc 2.35) so
# the shipped binaries run on Debian 12, Ubuntu 22.04+, and every newer
# distro — both architectures support the same set (ADR-0061); building
# on ubuntu-latest would require glibc 2.39 and break those systems.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  nsis-hooks-check:
    # Compile-check nsis-hooks.nsh with makensis before any bundle ships.
    # nsis-check.nsi mirrors Tauri's installer.nsi consumption (hooks file
    # included whole; POSTINSTALL expanded in installer context,
    # POSTUNINSTALL inside Section Uninstall — where only `un.` functions
    # may be Called).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check the NSIS hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          # the PREINSTALL hook File's the console exe; give makensis a
          # dummy at the repo-relative path the harness defines
          mkdir -p target/release
          touch target/release/epher.exe
          makensis crates/tauri-app/src-tauri/nsis-check.nsi
          makensis crates/tauri-app/src-tauri/nsis-theme-check.nsi

  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            # ADR-0061: the same glibc 2.35 floor as x86_64, so both
            # architectures support Debian 12 / Ubuntu 22.04+ alike.
            bundles: deb,rpm,appimage
          - os: macos-latest
            target: macos-aarch64
            # Only the .app: the release job signs it itself (ad-hoc) and
            # builds the DMG from the signed bundle, so Gatekeeper never
            # sees an unsigned bundle (ADR-0058 amendment).
            bundles: app
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        # From crates.io rather than a third-party action, as the pages
        # workflow does: the action's tarball downloads from
        # codeload.github.com, which rate-limits (429/503), and its
        # prebuilt trunk is x86_64-only — the arm64 leg got "Exec format
        # error". Compiling natively works on every runner arch.
        run: cargo install trunk --locked --version 0.21.14

      - name: Build the web app
        # The desktop shell embeds crates/web/dist (frontendDist), so the
        # embedded PWA must be built here with the exact command the pages
        # workflow uses. beforeBuildCommand was removed from tauri.conf.json
        # so `cargo tauri build` embeds THIS build unchanged — a second,
        # divergent trunk run once shipped a stale webview into the
        # installers (v0.4.34: the reload-merge fix was missing, constants
        # vanished on store reloads, and the guide's 3D animation example
        # errored with "unknown name"). The smoke test below verifies the
        # hash made it into the binary.
        run: trunk build --release
        working-directory: crates/web

      - name: Check the on-demand guide files
        # ADR-0053: the guide is not compiled into any binary; the web
        # app fetches guide/<locale>.md from dist, and the installers
        # carry the files as Tauri bundle resources for the TUI.
        shell: bash
        run: |
          set -e
          test -f crates/web/dist/guide/en.md
          test -f crates/web/dist/guide/zh-CN.md
          test "$(ls crates/web/dist/guide/*.md | wc -l)" -eq 8

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build desktop bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: crates/tauri-app/src-tauri

      - name: Smoke-test the unified CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/target/release/epher"
          # The same binary the bundle ships: one-shot CLI, bases, graphing.
          "$BIN" --version | grep -q "$(echo '${{ github.ref_name }}' | sed 's/^v//')"
          [ "$("$BIN" 'hex(255)')" = "0xff" ]
          [ "$("$BIN" '0b1010 + 0o17')" = "25" ]
          OUT="$(mktemp -d)"
          "$BIN" $'graph x^2\ngraph save '"$OUT"'/curves.svg' >/dev/null
          grep -q 'stroke-width: 1.00' "$OUT/curves.svg"
          "$BIN" $'graph3d x^2 - y^2\ngraph3d save '"$OUT"'/surface.svg' >/dev/null
          # The 3D parts markup carries class, points, and the ADR-0055
          # px-width stroke (vector-effect non-scaling-stroke); the exact
          # attribute order is not part of the contract.
          grep -q '<polyline' "$OUT/surface.svg"
          grep -q 'points="' "$OUT/surface.svg"
          grep -q 'vector-effect="non-scaling-stroke"' "$OUT/surface.svg"
          # Transparent exports (ADR-0055): no painted background rect.
          ! grep -q 'class="bg"' "$OUT/curves.svg"
          ! grep -q 'class="bg"' "$OUT/surface.svg"
          # The embedded webview must be THIS run's web build: the asset
          # filename (trunk's content hash) appears verbatim in the binary.
          HASH="$(grep -o 'epher-web-[a-f0-9]*\.js' "$GITHUB_WORKSPACE/crates/web/dist/index.html" | head -1)"
          # strings first, then grep: piping straight into grep -q lets the
          # early exit SIGPIPE the strings process, which macOS reports as
          # a pipeline failure under set -o pipefail.
          strings "$BIN" > "$OUT/strings.txt"
          grep -qF "$HASH" "$OUT/strings.txt"
          echo "embedded web build: $HASH"
          # The guide is not compiled into the binary (ADR-0053): the
          # markdown lives in the dist files and the bundle resources.
          ! grep -q "epher user guide" "$OUT/strings.txt"

      - name: Package bundles
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          BUNDLE="$GITHUB_WORKSPACE/target/release/bundle"
          case "${{ runner.os }}" in
            Linux)
              # The target is already linux-<arch> (linux-x86_64,
              # linux-aarch64) — no extra prefix.
              cp "$BUNDLE"/deb/*.deb artifacts/epher-${{ matrix.target }}.deb
              cp "$BUNDLE"/rpm/*.rpm artifacts/epher-${{ matrix.target }}.rpm
              cp "$BUNDLE"/appimage/*.AppImage artifacts/epher-${{ matrix.target }}.AppImage
              # The TUI reads the guide from the bundle resources
              # (ADR-0053): the deb/rpm must carry the 8 locale files.
              # grep -q closes the pipe on its first match, which SIGPIPEs
              # the listing producer; under pipefail that fails the check
              # even when the file is present, so read via a process
              # substitution whose status is grep's alone.
              grep -q "guide/en.md" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "guide/zh-CN.md" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "guide/en.md" <(rpm -qlp artifacts/epher-${{ matrix.target }}.rpm)
              # ADR-0058: the deb/rpm must also carry the script
              # collection under /usr/lib/epher/scripts — the guide's
              # terminal examples name those installed paths. (The
              # resources-map line was once lost between rounds and a
              # release shipped installers without the scripts.)
              grep -q "scripts/astronomy/moon/full-moons.epher" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "scripts/astronomy/moon/full-moons.epher" <(rpm -qlp artifacts/epher-${{ matrix.target }}.rpm)
              ;;
            macOS)
              # Ad-hoc signing (ADR-0058 amendment): a downloaded DMG
              # arrives with the com.apple.quarantine flag, and
              # Gatekeeper's check of a quarantined UNSIGNED bundle fails
              # hard — macOS reports the app as "damaged" with no
              # override. An ad-hoc signature is a valid signature: the
              # check passes and first launch shows the ordinary
              # right-click → Open warning the guide documents.
              APP="$GITHUB_WORKSPACE/target/release/bundle/macos/epher.app"
              test -d "$APP"
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict "$APP"
              # The DMG: volume epher, the app, the Applications symlink
              # — what the tauri dmg bundler lays out, rebuilt here from
              # the SIGNED bundle.
              STAGE="$(mktemp -d)"
              cp -R "$APP" "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              hdiutil create -volname epher -srcfolder "$STAGE" -ov -format UDZO \
                artifacts/epher-${{ matrix.target }}.dmg
              # The shipped DMG itself must verify: the Gatekeeper gate.
              hdiutil attach -nobrowse -readonly artifacts/epher-${{ matrix.target }}.dmg
              VOL="$(ls -d /Volumes/epher* | head -1)"
              codesign --verify --deep --strict "$VOL/epher.app"
              # ADR-0058: the app bundle carries the scripts at
              # Contents/Resources/scripts.
              test -f "$VOL/epher.app/Contents/Resources/scripts/astronomy/moon/full-moons.epher"
              hdiutil detach "$VOL"
              ;;
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe artifacts/epher-windows-x86_64.exe
              # ADR-0058: the NSIS installer carries the scripts beside
              # the binaries (%LOCALAPPDATA%\epher\scripts in currentUser
              # mode). 7-Zip lists the archive on the runner.
              7z l artifacts/epher-windows-x86_64.exe | grep -q "full-moons.epher"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  release:
    name: Attach assets to the release
    needs: [desktop, nsis-hooks-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            epher ${{ github.ref_name }} — one install, every frontend.

            Each platform ships a single download: the one-shot CLI, the
            REPL (`epher repl`), piped scripts (`epher -`), the terminal UI
            (`epher tui`), and the desktop app (bare `epher` / `epher gui`).

            - **Windows**: run `epher-windows-x86_64.exe` — the installer puts
              `epher` on your PATH (open a new terminal, then `epher "2 + 2"`).
              Desktop launches open the window with no console flash.
            - **macOS**: open `epher-macos-aarch64.dmg` (Apple Silicon) and
              drag epher to Applications. In the app, "Install the epher
              command" puts `epher` on your terminal PATH.
            - **Linux**: Debian/Ubuntu → add the apt repo once
              (https://epher.org, Linux → Debian/Ubuntu tab), then
              `apt install epher`; Fedora → the dnf repo, then
              `dnf install epher`; or grab `.deb` / `.rpm` / `.AppImage`
              directly (x86_64 and ARM64). Flathub
              (`com.epher.Desktop`) and Snap (`epher`)
              carry the same app when the store packages are published.

            - **Web app (PWA)**: https://epher.org/pwa/ — works
              fully offline.

            > Note: the builds carry no developer identity. Windows is
            > unsigned (choose *More info* → *Run anyway*). macOS is
            > ad-hoc signed — first launch: right-click epher → **Open**,
            > or System Settings → Privacy & Security → *Open Anyway*.

  linux-repos:
    # ADR-0061: serve the Linux packages from epher.org's apt and dnf
    # repositories. Publishes to the gh-pages branch (the site build
    # checks apt/ and rpm/ out of it into the deployment) after the
    # repositories pass a container install-smoke test. Skips with a
    # notice until the GPG_PRIVATE_KEY secret exists.
    name: linux repositories (apt + dnf)
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets check
        id: secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::apt/dnf repositories not published: set the GPG_PRIVATE_KEY secret (see ADR-0061)."
          fi

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          pattern: desktop-linux-*
          merge-multiple: true
          path: assets

      - name: Install repo tooling
        if: steps.secrets.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c

      - name: Import the signing key
        if: steps.secrets.outputs.skip == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "GPG_OPTS=--batch --yes --pinentry-mode loopback --passphrase $GPG_PASSPHRASE" >> "$GITHUB_ENV"
          fi
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print "KEYID=" $10; exit}' >> "$GITHUB_ENV"

      - name: Build the apt repository
        if: steps.secrets.outputs.skip == 'false'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GPG_OPTS="${GPG_OPTS:-}"   # unset when the key has no passphrase
          VERSION_NUM="${VERSION#v}"
          mkdir -p apt/pool/main/e/epher
          # Latest only (ADR-0061): the repo carries exactly the
          # current release under its canonical pool name. (Before the
          # loop — inside it, the arm64 pass deletes the amd64 copy.)
          rm -f apt/pool/main/e/epher/*.deb
          for arch in amd64 arm64; do
            # Release artifacts use the Rust target name; the apt pool
            # uses the Debian architecture name.
            case "$arch" in
              amd64) src="assets/epher-linux-x86_64.deb" ;;
              arm64) src="assets/epher-linux-aarch64.deb" ;;
            esac
            cp "$src" "apt/pool/main/e/epher/epher_${VERSION_NUM}_${arch}.deb"
          done
          mkdir -p apt/dists/stable/main/binary-amd64 apt/dists/stable/main/binary-arm64
          (
            cd apt
            # Index each deb directly — that pins the Filename field to
            # the pool path and keeps each suite's Packages file to its
            # own architecture (apt-ftparchive has no --arch filter).
            for arch in amd64 arm64; do
              apt-ftparchive packages "pool/main/e/epher/epher_${VERSION_NUM}_${arch}.deb" \
                > "dists/stable/main/binary-$arch/Packages"
              gzip -k -f "dists/stable/main/binary-$arch/Packages"
            done
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=epher \
              -o APT::FTPArchive::Release::Label=epher \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o 'APT::FTPArchive::Release::Architectures=amd64 arm64' \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Description="epher — a programmable, scriptable calculator" \
              release dists/stable > dists/stable/Release
            gpg $GPG_OPTS --armor --detach-sign --local-user "$KEYID" \
              -o dists/stable/Release.gpg dists/stable/Release
            gpg $GPG_OPTS --clearsign --local-user "$KEYID" \
              -o dists/stable/InRelease dists/stable/Release
          )
          # Binary keyring, not armored: apt's signed-by on Debian 12
          # (apt 2.6) cannot verify an armored key — it fails with
          # NO_PUBKEY. dnf accepts either format.
          gpg --batch --export "$KEYID" > apt/KEY.gpg

      - name: Build the dnf repository
        if: steps.secrets.outputs.skip == 'false'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GPG_OPTS="${GPG_OPTS:-}"   # unset when the key has no passphrase
          mkdir -p rpm/x86_64 rpm/aarch64
          cp assets/epher-linux-x86_64.rpm rpm/x86_64/
          cp assets/epher-linux-aarch64.rpm rpm/aarch64/
          # Latest only (ADR-0061): each publish replaces the tree.
          # Tree layout: rpm/<arch> — epher.repo's baseurl is
          # https://epher.org/rpm/$basearch, so repodata must live at
          # rpm/<arch>/repodata (the smoke container checks exactly
          # that path).
          (
            cd rpm
            printf '%s\n' "%_gpg_name $KEYID" > "$HOME/.rpmmacros"
            find . -name '*.rpm' -exec rpmsign --addsign {} \;
            for arch in x86_64 aarch64; do
              createrepo_c "$arch"
            done
            gpg $GPG_OPTS --armor --detach-sign --local-user "$KEYID" \
              x86_64/repodata/repomd.xml
            gpg $GPG_OPTS --armor --detach-sign --local-user "$KEYID" \
              aarch64/repodata/repomd.xml
          )

      - name: Container install-smoke (Debian 12 + Fedora)
        if: steps.secrets.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python3 -m http.server 8088 --directory . >/dev/null 2>&1 &
          SERVER=$!
          sleep 1
          docker run --rm --network host -v "$PWD/apt:/mnt/apt:ro" debian:12 bash -ec '
            apt-get update -qq
            apt-get install -y -qq ca-certificates gnupg >/dev/null
            mkdir -p /etc/apt/keyrings
            cp /mnt/apt/KEY.gpg /etc/apt/keyrings/epher.gpg
            printf "Types: deb\nURIs: http://localhost:8088/apt\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/epher.gpg\n" \
              > /etc/apt/sources.list.d/epher.sources
            apt-get update -qq
            apt-get install -y -qq epher >/dev/null
            [ "$(epher '"'"'2 + 2'"'"')" = "4" ]'
          echo "debian:12 apt smoke ok"
          docker run --rm --network host -v "$PWD:/mnt:ro" fedora:41 bash -ec '
            printf "[epher]\nname=epher\nbaseurl=http://localhost:8088/rpm/\$basearch\ngpgcheck=1\ngpgkey=file:///mnt/apt/KEY.gpg\nenabled=1\n" \
              > /etc/yum.repos.d/epher.repo
            dnf install -y epher >/dev/null
            [ "$(epher '"'"'2 + 2'"'"')" = "4" ]'
          echo "fedora:41 dnf smoke ok"
          kill $SERVER

      - name: Publish to gh-pages
        if: steps.secrets.outputs.skip == 'false'
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git   # the https clone/push below need the token
          git clone --depth 1 --branch gh-pages "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" publish 2>/dev/null \
            || { git init publish && cd publish && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" && git switch --orphan gh-pages && cd ..; }
          cd publish
          git config user.name "epher release"
          git config user.email "release@epher.org"
          mkdir -p apt rpm
          rsync -a --delete ../apt/ apt/
          rsync -a --delete ../rpm/ rpm/
          git add -A apt rpm
          if git diff --cached --quiet; then
            echo "repositories unchanged"
          else
            git commit -m "linux repositories for $VERSION"
            git push origin gh-pages
          fi

      - name: Redeploy the site with the new repositories
        if: steps.secrets.outputs.skip == 'false'
        run: gh workflow run pages --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  snap:
    # ADR-0061: the Snap Store channel. Repacks the release .deb (the
    # two artifacts cannot drift), strict confinement, amd64 + arm64.
    # Publishes only when SNAPCRAFT_STORE_CREDENTIALS is set.
    name: snap (${{ matrix.arch }})
    needs: [release]
    # Provisioning-dependent channel: a snapcraft/runner surprise must
    # not red the release while the store account is still being set
    # up. Once the snap ships routinely, remove this flag and let it
    # gate like every other job.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the release version into the manifest
        # override-pull fetches the release .deb by versioned URL, so
        # the version must be in the yaml BEFORE snapcraft runs (a
        # craftctl set-version only happens later, during build).
        run: |
          set -e
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" packaging/snap/snapcraft.yaml
          grep -q "version: \"${GITHUB_REF_NAME#v}\"" packaging/snap/snapcraft.yaml

      - name: Build the snap
        uses: snapcore/action-build@v1
        with:
          path: packaging/snap
      - name: Publish to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::notice::snap not published: set the SNAPCRAFT_STORE_CREDENTIALS secret (see ADR-0061)."
            exit 0
          fi
          # action-build leaves the .snap beside the manifest, not in the
          # repo root — find it wherever it landed.
          SNAP_FILE=$(find . -name "epher_${VERSION#v}_${ARCH}.snap" | head -1)
          if [ -z "$SNAP_FILE" ]; then
            echo "::error::built snap not found: epher_${VERSION#v}_${ARCH}.snap"
            exit 1
          fi
          snapcraft upload "$SNAP_FILE" --release=stable

  store-bumps:
    # ADR-0061: the Flathub manifest version-bumps with the release. The
    # job skips with a notice until its deploy key (FLATHUB_SSH_KEY)
    # exists.
    name: bump Flathub
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump the Flathub manifest
        env:
          VERSION: ${{ github.ref_name }}
          FLATHUB_SSH_KEY: ${{ secrets.FLATHUB_SSH_KEY }}
        run: |
          if [ -z "$FLATHUB_SSH_KEY" ]; then
            echo "::notice::Flathub not bumped: set the FLATHUB_SSH_KEY secret (repo flathub/com.epher.Desktop, ADR-0061)."
            exit 0
          fi
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$FLATHUB_SSH_KEY"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone "git@github.com:flathub/com.epher.Desktop.git" flathub
          bash scripts/bump-stores.sh flathub "$VERSION" flathub
