name: store api test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: stores
    steps:
      - name: token, then applications
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          set -e
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            -d grant_type=client_credentials \
            -d "client_id=${CLIENT}" \
            -d "client_secret=${SECRET}" \
            -d "scope=https://manage.devcenter.microsoft.com/.default")
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "token call: HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            printf '%s' "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print('error:',d.get('error'));print('detail:',str(d.get('error_description'))[:200])" || true
            exit 1
          fi
          TOKEN=$(printf '%s' "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "token received: ${#TOKEN} chars (value not shown)"
          APPS=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://manage.devcenter.microsoft.com/v1.0/my/applications")
          ACODE=$(printf '%s' "$APPS" | tail -1)
          ABODY=$(printf '%s' "$APPS" | sed '$d')
          echo "applications call: HTTP ${ACODE}"
          printf '%s' "$ABODY" > /tmp/apps.json
          echo "raw body (no secrets): $(printf '%s' "$ABODY" | head -c 600)"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/apps.json'))
          if 'error' in d or 'code' in d:
              print('API error code:', d.get('code') or d.get('error', {}).get('code'))
              print('API message:', str(d.get('message') or d.get('error', {}).get('message'))[:300])
          if 'error' in d:
              print('API error:', d['error'].get('code'))
              print('detail:', str(d['error'].get('message'))[:300])
          else:
              apps = d.get('value', [])
              print(f'applications visible to this app: {len(apps)}')
              for a in apps:
                  print(' -', a.get('id'), '|', a.get('primaryName'))
          PY

  cli:
    # The same credential through the tool the publish job drives, which
    # is the half the raw REST test above cannot cover: that the seller
    # id is accepted and the CLI can read the product. Read-only, no
    # submission is created. windows-latest for the same reason the
    # publish job uses it: reconfigure persists the secret through the
    # platform credential manager, and the Linux build wants libsecret.
    runs-on: windows-latest
    environment: stores
    steps:
      - name: Secrets check
        id: secrets
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          if ($env:TENANT -and $env:CLIENT -and $env:SECRET) {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::store cli test skipped: the MSSTORE_* secrets are not set in the stores environment."
          }

      - name: Install the Microsoft Store Developer CLI
        if: steps.secrets.outputs.skip == 'false'
        uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.4.4

      - name: Configure, then read the catalog and the submission state
        if: steps.secrets.outputs.skip == 'false'
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with $LASTEXITCODE" }
          Write-Host "=== applications ==="
          msstore apps list
          if ($LASTEXITCODE -ne 0) { throw "msstore apps list failed with $LASTEXITCODE" }
          Write-Host "=== last submission ==="
          msstore submission status 9NWXQ035T8TB 2>$null | Out-File -FilePath status.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "msstore submission status failed with $LASTEXITCODE" }
          $status = (Get-Content -Raw status.json | ConvertFrom-Json).status
          Write-Host "submission status: $status"
          if ([string]::IsNullOrWhiteSpace($status)) { throw "the CLI printed no status field" }
