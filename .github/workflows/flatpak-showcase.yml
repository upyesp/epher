# Records the Flathub submission video: builds the flatpak exactly as the
# manifest says, installs it, drives it under Xvfb, and records the screen.
# The mp4 lands in the run artifacts; it is committed to site/img/flatpak/
# afterwards so the listing and the PR can link it.
name: flatpak showcase recording

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg xdotool flatpak flatpak-builder
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: epher.flatpak
          manifest-path: packaging/flatpak/org.epher.Desktop.yml
      - name: Install the bundle
        run: flatpak install --user -y epher.flatpak
      - name: Record the showcase
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          XVFB=$!
          sleep 2
          export DISPLAY=:99
          flatpak run com.epher.Desktop &
          sleep 25
          ffmpeg -y -f x11grab -video_size 1440x900 -framerate 30 -i :99 \
            -t 50 -pix_fmt yuv420p -c:v libx264 -preset fast showcase.mp4 &
          FF=$!
          sleep 4
          WIN=$(xdotool search --name "^epher" | tail -1)
          xdotool windowactivate $WIN || true
          type_line() {
            xdotool mousemove --window $WIN 230 33 click 1
            sleep 0.8
            xdotool type --delay 30 "$1"
            sleep 0.5
            xdotool key Return
            sleep 1.5
          }
          type_line "def disc(a, b, c) = b^2 - 4*a*c"
          type_line "disc(2, 7, 3)"
          type_line "radius = 6371 km"
          type_line "circumference = 2 * pi * radius"
          type_line "circumference in mile"
          type_line "speed = 55 mile/hr"
          type_line "speed in km/hr"
          sleep 2
          type_line "graph sin(x) from -6.5 to 6.5"
          sleep 4
          type_line "graph3d x^2 - y^2"
          sleep 8
          wait $FF || true
          kill $XVFB 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: showcase.mp4
