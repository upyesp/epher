name: eclipse publish

# The Eclipse channel's p2 update site (clients/eclipse): the feature
# that wraps the LSP4E bundle, built with Tycho, published to gh-pages
# under eclipse/updates/ and served at the stable URL
# https://epher.org/eclipse/updates/ — the URL the Eclipse Marketplace
# listing points at, which is why it must never move
# (docs/research/eclipse-marketplace-publishing.md,
# clients/eclipse/listing/SUBMISSION.md).
#
# Called by release.yml for every tag, and dispatchable by hand for the
# first publication or a re-publish. No secret: the Marketplace itself
# is a browser-only web form with a read-only API, and the gh-pages push
# rides the repository's own GITHUB_TOKEN, the same path the apt and rpm
# repositories use.

on:
  workflow_call:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the caller's ref)"
        type: string
        default: ""
      version:
        description: "version to stamp, without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to build (defaults to the default branch)"
        type: string
        default: ""
      version:
        description: "version to stamp, without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"
      publish:
        description: "push the built update site to gh-pages (uncheck for a dry run)"
        type: boolean
        default: true

permissions:
  contents: write # the gh-pages push and the release asset upload
  actions: write # gh workflow run pages

jobs:
  updatesite:
    name: build and publish the p2 update site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
        # The runner image's Maven moves under us (the 20261004 image
        # ships one Tycho 4.0.13 cannot provision its p2 resolver
        # under: "No implementation for MavenTargetLocationFactory was
        # bound"), so the p2 update site pins the Maven it builds with
        # the same way the pom pins Tycho.

      - name: Check the bundle's shared copies are in sync
        # The Tycho bundle carries copies of the shared grammar and
        # language configuration. Drift is a defect at build time either
        # way, dry run or not.
        run: python3 clients/eclipse/sync-assets.py --check

      - name: Resolve the release version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -e
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ] || [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Stamp the train version
        # Every version surface 0.0.0 placeholder becomes the train
        # version: the three poms, the MANIFEST's Bundle-Version, the
        # feature's own version and its plugin reference, and
        # category.xml. tycho-versions does all of them at once (checked:
        # a plain set of seds misses category.xml).
        run: |
          set -e
          mvn -B -f clients/eclipse/pom.xml \
            org.eclipse.tycho:tycho-versions-plugin:4.0.13:set-version \
            -DnewVersion="$VERSION"
          grep -q "^Bundle-Version: $VERSION" clients/eclipse/io.github.upyesp.epher.eclipse/META-INF/MANIFEST.MF
          grep -q "version=\"$VERSION\"" clients/eclipse/io.github.upyesp.epher.eclipse.feature/feature.xml

      - name: Build the update site
        # `clean verify` writes the repository, the publishable tree, to
        # the updatesite module's target/repository/.
        run: mvn -B -f clients/eclipse/pom.xml clean verify

      - name: Smoke-test the repository
        run: |
          set -euo pipefail
          repo="clients/eclipse/io.github.upyesp.epher.eclipse.updatesite/target/repository"
          for f in content.jar artifacts.jar p2.index; do
            test -f "$repo/$f" || { echo "missing $repo/$f" >&2; exit 1; }
          done
          unzip -p "$repo/content.jar" content.xml > /tmp/content.xml
          grep -q "io.github.upyesp.epher.eclipse.feature.feature.group" /tmp/content.xml
          grep -q "$VERSION" /tmp/content.xml
          bundle="$repo/plugins/io.github.upyesp.epher.eclipse_$VERSION.jar"
          test -f "$bundle"
          unzip -l "$bundle" | grep -q "EpherConnectionProvider.class"
          unzip -l "$bundle" | grep -q "syntaxes/epher.tmLanguage.json"
          echo "repository: $(du -sh "$repo" | cut -f1), feature 0.5.x stamped as $VERSION"
          echo "the real install test (p2 director) runs against the published URL; see listing/SUBMISSION.md"

      - name: Publish to gh-pages
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="clients/eclipse/io.github.upyesp.epher.eclipse.updatesite/target/repository"
          gh auth setup-git
          git clone --depth 1 --branch gh-pages "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" publish
          cd publish
          git config user.name "epher release"
          git config user.email "release@epher.org"
          mkdir -p eclipse/updates
          rsync -a --delete "../$repo/" eclipse/updates/
          git add -A eclipse
          if git diff --cached --quiet; then
            echo "update site unchanged"
          else
            git commit -m "eclipse update site for $VERSION"
            git push origin gh-pages
          fi

      - name: Attach the update-site zip to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="clients/eclipse/io.github.upyesp.epher.eclipse.updatesite/target/io.github.upyesp.epher.eclipse.updatesite-$VERSION.zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber

      - name: Redeploy the site with the new update site
        # epher.org serves apt/, rpm/ and eclipse/ out of gh-pages; the
        # site build only re-archives them on a deploy.
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages --ref main
