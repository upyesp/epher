name: store analytics
# Partner Center keeps acquisitions and usage behind login; the public
# storefront and the displaycatalog API carry ratings only, never install
# counts (verified 2026-10-26: even Windows Calculator shows PurchaseCount 0
# there). This job pulls the private numbers with the same Entra
# client-credentials flow as store api test and prints totals to the run
# summary, so one dispatch (or the monthly schedule) records them without
# opening Partner Center.
#
# Endpoint contracts (learn.microsoft.com/en-us/windows/uwp/monetize/
# get-app-acquisitions and get-app-usage-daily), both under
# manage.devcenter.microsoft.com/v1.0/my/analytics with a bearer token:
#   appacquisitions — rows of {date, acquisitionQuantity}; the window takes
#                     M/D/YYYY dates and groupby=date keeps one row per day
#   usagedaily      — rows of {date, dailyNewUsers, dailyActiveDevices,
#                     dailyActiveUsers, dailySessionCount,
#                     engagementDurationMinutes, monthlyActiveDevices}
# Both paginate with top/skip and hand back @nextLink. The numbers lag a few
# days, so the scheduled run lands on the 5th and the window ends yesterday.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "count from this date, YYYY-MM-DD (default: first publish, 2026-10-02)"
        required: false
        default: "2026-10-02"
  schedule:
    - cron: "0 6 5 * *" # monthly on the 5th, past the acquisition/usage latency

jobs:
  analytics:
    runs-on: ubuntu-latest
    environment: stores
    steps:
      - name: acquisitions and usage totals
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          APP: "9NWXQ035T8TB"
          SINCE: ${{ github.event.inputs.since || '2026-10-02' }}
        run: |
          set -e
          # the analytics endpoints document M/D/YYYY windows
          SINCE_US=$(date -u -d "${SINCE}" +"%-m/%-d/%Y")
          END_US=$(date -u -d yesterday +"%-m/%-d/%Y")
          echo "window: ${SINCE} .. yesterday (submitted as ${SINCE_US} .. ${END_US})"

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            -d grant_type=client_credentials \
            -d "client_id=${CLIENT}" \
            -d "client_secret=${SECRET}" \
            -d "scope=https://manage.devcenter.microsoft.com/.default")
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "token call: HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            printf '%s' "$BODY" | python3 -c "import sys,json;d=json.load(sys.stdin);print('error:',d.get('error'));print('detail:',str(d.get('error_description'))[:200])" || true
            exit 1
          fi
          TOKEN=$(printf '%s' "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "token received: ${#TOKEN} chars (value not shown)"

          TOKEN="${TOKEN}" APP="${APP}" SINCE="${SINCE}" US="${SINCE_US}" UE="${END_US}" python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          token, app = os.environ['TOKEN'], os.environ['APP']
          since_us, end_us = os.environ['US'], os.environ['UE']
          since = dt.date.fromisoformat(os.environ['SINCE'])
          yesterday = dt.date.today() - dt.timedelta(days=1)

          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', 'replace')[:400]
                  if e.code in (401, 403) or 'Unauthorized' in detail:
                      raise SystemExit(
                          f'HTTP {e.code} from {url.split("?")[0]}: {detail}\n'
                          'The Entra token is valid but Partner Center rejects it: the '
                          'application is not associated with the account or lacks the '
                          'Manager role. Fix in Partner Center (portal, human-only): '
                          'Account settings, User management, add the Entra application '
                          'by its client id (MSSTORE_CLIENT_ID) with the Manager role, '
                          'then re-run. store-api-test prints the same signature but '
                          'exits 0, so do not trust its green check.')
                  raise SystemExit(f'HTTP {e.code} from {url.split("?")[0]}: {detail}')

          def fetch_all(path):
              rows, url, pages = [], f'https://manage.devcenter.microsoft.com/v1.0/my/analytics/{path}', 0
              while url:
                  d = get(url)
                  if 'error' in d:
                      raise SystemExit(f"API error on {path}: {d['error'].get('code')} "
                                       f"{str(d['error'].get('message'))[:300]}")
                  rows += d.get('Value', [])
                  url, pages = d.get('@nextLink'), pages + 1
                  if pages > 100:
                      raise SystemExit(f'{path}: more than 100 pages, aborting')
              print(f'{path}: {len(rows)} rows in {pages} page(s)')
              return rows

          acq = fetch_all(f'appacquisitions?applicationId={app}&startDate={since_us}&endDate={end_us}'
                          f'&aggregationLevel=day&groupby=date&top=500')
          usage = fetch_all(f'usagedaily?applicationId={app}&startDate={since_us}&endDate={end_us}'
                            f'&groupby=date&top=500')

          total_acq = sum(int(r.get('acquisitionQuantity', 0)) for r in acq)
          total_new_users = sum(int(r.get('dailyNewUsers', 0)) for r in usage)
          total_sessions = sum(int(r.get('dailySessionCount', 0)) for r in usage)
          total_hours = round(sum(float(r.get('engagementDurationMinutes', 0)) for r in usage) / 60, 1)

          def day(r):
              try:
                  return dt.date.fromisoformat(str(r.get('date', ''))[:10])
              except ValueError:
                  return None

          last30 = [r for r in usage if (d := day(r)) and d >= yesterday - dt.timedelta(days=29)]
          dau30 = round(sum(int(r.get('dailyActiveDevices', 0)) for r in last30) / len(last30), 1) if last30 else 0
          mau = max((int(r.get('monthlyActiveDevices', 0)) for r in usage), default=0)

          lines = [
              '## Microsoft Store — epher (9NWXQ035T8TB)',
              '',
              f'window {since} .. {yesterday} — Partner Center data lags a few days',
              '',
              '| metric | value |',
              '|---|---|',
              f'| acquisitions (store installs/gets) | {total_acq} |',
              f'| new users (`usagedaily` dailyNewUsers) | {total_new_users} |',
              f'| sessions | {total_sessions} |',
              f'| engagement | {total_hours} h |',
              f'| avg daily active devices, last 30d | {dau30} |',
              f'| peak monthly active devices | {mau} |',
              '',
              'Acquisitions from `analytics/appacquisitions`, the rest from',
              '`analytics/usagedaily`. The storefront and displaycatalog do not',
              'publish install counts, so this summary is the record.',
          ]
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(text)
          PY
