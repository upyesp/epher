name: luarocks publish

# The LuaRocks channel for the Neovim client (clients/nvim), the registry
# rocks.nvim installs from with `:Rocks install epher`. This workflow is
# intentionally NOT called by release.yml: it triggers on the v* tag
# itself, because the tag is the whole input. lumen-oss/luarocks-tag-release
# fetches the GitHub archive of the pushed tag, generates the rockspec from
# clients/nvim/epher-scm-1.rockspec, tests a local install of it, uploads
# the rock, then tests the installed-from-server rock. Wiring it into
# release.yml would run it twice.
#
# The gated secret is a luarocks.org API key. Mint a fresh one at
# https://luarocks.org/settings/api-keys: the September 2026 security
# incident revoked every key on the server (and ended every session), so
# any key dated before 2026-09-26 is dead. Store it as LUAROCKS_API_KEY in
# the stores environment; the job prints a notice and skips while the
# secret is absent (the same gate pattern as jetbrains-publish.yml).
# Channel mechanics: docs/research/neovim-publishing.md.

on:
  workflow_dispatch:
    # ADR-0073: the release dispatches this channel after it cuts the
    # tag and publishes the release; a tag push carries no workflow
    # events when the pusher is the release run's own token.
    inputs:
      version:
        description: the train to publish, e.g. 0.5.80 (a leading v is accepted)
        required: true
        type: string
      force:
        description: re-upload even if the version already exists (repair a broken upload with luarocks upload --force)
        required: false
        type: boolean
        default: false

jobs:
  luarocks:
    name: publish the epher rock
    environment: stores
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the version and the tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Wait for the release to be published
        # ADR-0073: the channel follows the release. The tag fires this
        # workflow; if no published release exists for it after ten
        # minutes, the tag raced a failed release and nothing ships.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="v${TAG#v}"
          last=""
          for i in $(seq 1 20); do
            if last="$(gh release view "$TAG" --repo upyesp/epher --json isDraft --jq .isDraft 2>&1)"; then
              if [ "$last" = "false" ]; then
                echo "release $TAG is published"
                exit 0
              fi
              echo "attempt $i: release $TAG exists but isDraft=$last"
            else
              echo "attempt $i: release $TAG not visible: $last"
            fi
            sleep 30
          done
          echo "::error::no published release for $TAG after 10 minutes (last: $last); the channel follows the release (ADR-0073)"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Check the runtime copies are in sync with clients/vim
        # The rock ships the copies in clients/nvim, not clients/vim, so
        # stale copies would ship silently. Run even when the upload is
        # skipped: drift is a defect at tag time either way.
        run: python3 clients/nvim/sync-runtime.py --check

      - name: Skip with a notice until LUAROCKS_API_KEY exists
        id: gate
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::notice::LUAROCKS_API_KEY is not set in the stores environment; the LuaRocks upload is skipped. Create a fresh key at https://luarocks.org/settings/api-keys (keys minted before 2026-09-26 were revoked by the September 2026 security incident) and add it as the secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach the nvim source zip to the release
        # The rock's source.url (see clients/nvim/epher-scm-1.rockspec)
        # points at this asset: the contents of clients/nvim at the tag,
        # so the packed src.rock stays small instead of carrying the
        # whole monorepo archive. Idempotent: --clobber replaces it on
        # every dispatch, and the public release is where the wait step
        # has already confirmed this train exists.
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET="epher-nvim-source-$TAG.zip"
          (cd clients/nvim && zip -qr "$OLDPWD/$ASSET" .)
          gh release upload "$TAG" "$ASSET" --repo upyesp/epher --clobber
          echo "attached $ASSET"

      - name: Re-upload the packed rock (forced)
        # An upload mistake can leave a version half-published: the
        # 0.9.7-1 train registered the rockspec but the packed src.rock
        # never landed (server API failure), and the action's duplicate
        # guard then skips every re-drive. Upstream luarocks has no
        # remote-delete command, but `luarocks upload --force` is its
        # documented tool for upload mistakes: it replaces the existing
        # rockspec and sends the packed rock again. The rockspec re-used
        # here is the server's registered copy, so the replacement is
        # byte-identical. The source-built luarocks talks to luarocks.org
        # through curl (its API client falls back to curl when LuaSec is
        # absent), so HTTPS is real.
        if: inputs.force == true && steps.gate.outputs.skip != 'true'
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Ubuntu ships luarocks 3.8; build the pinned upstream release
          # instead of trusting the distro package. Errors stay visible:
          # a silent fetch here cost a debug round-trip.
          sudo apt-get install -y --no-install-recommends liblua5.4-dev lua5.4 unzip zip curl >/dev/null
          WORK="$(mktemp -d)"
          curl -fL --retry 3 -o "$WORK/luarocks.tar.gz" https://luarocks.org/releases/luarocks-3.11.1.tar.gz
          tar -xzf "$WORK/luarocks.tar.gz" -C "$WORK"
          cd "$WORK/luarocks-3.11.1"
          ./configure --lua-version=5.4 --with-lua-bin=/usr/bin --with-lua-include=/usr/include/lua5.4 >/dev/null
          make -j2 >/dev/null
          # No `make install`: its lua-file loop dies silently on the
          # runner. The make tree already yields a runnable CLI.
          LR="$WORK/luarocks-3.11.1/build/luarocks"
          chmod +x "$LR"
          # The wrapper searches the install tree; without `make
          # install`, point it at the source modules instead.
          export LUA_PATH="$WORK/luarocks-3.11.1/src/?.lua;$WORK/luarocks-3.11.1/src/?/init.lua;;"
          export LUA_CPATH="$WORK/luarocks-3.11.1/src/?.so;;"
          "$LR" --version
          REV="${VERSION}-1"
          if ! curl -fL --retry 5 --retry-all-errors --connect-timeout 15 -o "epher-${REV}.rockspec" "https://luarocks.org/manifests/upyesp/epher-${REV}.rockspec"; then
            echo "::error::registered-rockspec fetch failed (curl exit $?)"
            exit 1
          fi
          ls -la "epher-${REV}.rockspec"
          head -3 "epher-${REV}.rockspec"
          # Patch only the source block: the registered rockspec still
          # points at the whole-repo tag archive (whose packed rock the
          # server rejects), while the template now points at the
          # release asset attached above.
          sed -i "s|url = repo_url .. '/archive/' .. git_ref .. '.zip',|url = repo_url .. '/releases/download/v' .. modrev .. '/epher-nvim-source-v' .. modrev .. '.zip',|" "epher-${REV}.rockspec"
          sed -i "s|^  dir = .*|  dir = '.',|" "epher-${REV}.rockspec"
          grep -q "releases/download/v$VERSION/epher-nvim-source-v$VERSION.zip" "epher-${REV}.rockspec"
          grep -q "  dir = '.'," "epher-${REV}.rockspec"
          "$LR" upload "epher-${REV}.rockspec" --force --api-key="$LUAROCKS_API_KEY"
          echo "epher $REV re-uploaded (rockspec replaced, packed rock sent)"

      - name: Upload the rock
        if: steps.gate.outputs.skip != 'true'
        uses: lumen-oss/luarocks-tag-release@v7
        with:
          # Explicit version: the action would otherwise parse the git
          # ref, and a dispatch run's ref is the branch, not the tag.
          version: ${{ steps.v.outputs.version }}
          # The monorepo subdirectory is not the action's generated default;
          # the template's source.dir points the build at clients/nvim.
          template: clients/nvim/epher-scm-1.rockspec
          # Explicit labels (the action would otherwise take the repo's
          # GitHub topics, and the neovim topic is not set yet). The
          # neovim label is what lists the rock on luarocks.org/labels/neovim.
          labels: |
            neovim
            lsp
            syntax
          summary: A calculator language with inline answers for every statement
          # Plain text on the rock page (no markdown renderer), adapted from
          # clients/vscode/README.md. No social media links, per the house rule.
          detailed_description: |
            epher is a calculator language: you write ordinary math, with units
            that convert, and every statement's answer appears inline right next
            to the line that produced it.

            The rock ships the runtime files and the Lua module that wire the
            shared epher language server into Neovim: live diagnostics, inline
            answers as inlay hints, hover signatures, completion, definition
            jumps, and the EpherRun results window.

            The epher-lsp binary is a separate download from the GitHub
            releases page; after that everything runs locally.
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
