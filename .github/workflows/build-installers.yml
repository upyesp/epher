# Build the unified epher installers for every platform (reusable).
#
# One download per platform (ADR-0011): each installer carries the unified
# `epher` executable — one-shot CLI, REPL (`epher repl`), piped scripts
# (`epher -`), TUI (`epher tui`), and the desktop GUI (bare `epher` /
# `epher gui`). Windows installs two subsystem builds of the same program
# (console `epher.exe` on PATH; GUI-subsystem `epher-gui.exe` as the
# double-click target — no console flash); macOS/Linux install the single
# binary. On Windows the NSIS installer adds the install directory to the
# user PATH (nsis-hooks.nsh), and a hook Files the console build next to
# the GUI main binary — `bundle.resources` cannot (tauri-build copies
# resources during cargo build, before the sibling binary exists).
#
# Asset names (stable — the landing page links to these):
#   epher-windows-x86_64.exe        Windows installer (NSIS)
#   epher-macos-aarch64.dmg         macOS disk image (Apple Silicon only —
#                                   ADR-0025 dropped the Intel build)
#   epher-linux-x86_64.deb          Debian/Ubuntu and derivatives
#   epher-linux-x86_64.rpm          Fedora/RHEL and derivatives
#   epher-linux-x86_64.AppImage     everything else, incl. Arch — runs as-is
#   epher-linux-aarch64.*           the same three, ARM64 (ADR-0061)
#
# Every leg also builds the language server (ADR-0066) and drops it in
# the same artifacts dir, so it rides the public release and the staging
# draft under the same stable names the extensions resolve:
#   epher-lsp-linux-x86_64.gz       the shared epher-lsp binary, gzipped
#   epher-lsp-linux-aarch64.gz
#   epher-lsp-macos-aarch64.gz      stripped, ad-hoc signed
#   epher-lsp-windows-x86_64.zip    zip with the exe at the archive root
#   epher-vscode.vsix               the VS Code extension (stable name)
#   epher-jetbrains.zip             the JetBrains plugin (stable name)
#   epher-visualstudio.vsix         the Visual Studio 2022 extension (stable name)
#   epher-zed.zip                   the Zed dev extension (source; Zed compiles it)
#   epher-nvim.zip                  the Neovim configuration
#   epher-vim.zip                   the Vim configuration
#   epher-sublime.zip               the Sublime Text configuration
#
# Callers (ADR-0062):
#   - release.yml — a public vX.Y.Z tag push: builds the tag, then the
#     caller's publish jobs attach the artifacts to the public release,
#     rebuild the apt/dnf repositories, and bump the stores;
#   - staging-build.yml — a manual dispatch against the staging branch:
#     builds the branch, then the caller drops the artifacts into a
#     hidden draft release for testing. A staging build is therefore the
#     dress rehearsal of the exact bytes a public release will ship.
#
# The builds carry no developer identity: Windows is unsigned, macOS is
# ad-hoc signed (a valid signature, so Gatekeeper's "damaged" check
# passes) — first launch shows the ordinary overridable warning, and the
# guide documents the right-click → Open path for each OS.
#
# The Linux legs pin ubuntu-22.04 and ubuntu-22.04-arm (glibc 2.35) so
# the shipped binaries run on Debian 12, Ubuntu 22.04+, and every newer
# distro — both architectures support the same set (ADR-0061); building
# the webview dependencies natively (no prebuilt cache) keeps the two
# architectures identical by construction. The macOS leg runs on
# macos-latest (Apple silicon) and the Windows leg on windows-latest.
name: build installers (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out and build (tag ref, branch, or commit)
        type: string
        required: true
      version:
        description: >-
          Version the built CLI must report (may carry a leading v).
          "auto" reads crates/cli/Cargo.toml from the checked-out ref.
        type: string
        default: auto

permissions:
  contents: read

jobs:
  nsis-hooks-check:
    # Compile-check nsis-hooks.nsh with makensis before any bundle ships.
    # nsis-check.nsi mirrors Tauri's installer.nsi consumption (hooks file
    # included whole; POSTINSTALL expanded in installer context,
    # POSTUNINSTALL inside Section Uninstall — where only `un.` functions
    # may be Called).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Compile-check the NSIS hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          # the PREINSTALL hook File's the console exe; give makensis a
          # dummy at the repo-relative path the harness defines
          mkdir -p target/release
          touch target/release/epher.exe
          makensis crates/tauri-app/src-tauri/nsis-check.nsi
          makensis crates/tauri-app/src-tauri/nsis-theme-check.nsi

  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            # ADR-0061: the same glibc 2.35 floor as x86_64, so both
            # architectures support Debian 12 / Ubuntu 22.04+ alike.
            bundles: deb,rpm,appimage
          - os: macos-latest
            target: macos-aarch64
            # Only the .app: the release job signs it itself (ad-hoc) and
            # builds the DMG from the signed bundle, so Gatekeeper never
            # sees an unsigned bundle (ADR-0058 amendment).
            bundles: app
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        # From crates.io rather than a third-party action, as the pages
        # workflow does: the action's tarball downloads from
        # codeload.github.com, which rate-limits (429/503), and its
        # prebuilt trunk is x86_64-only — the arm64 leg got "Exec format
        # error". Compiling natively works on every runner arch.
        run: cargo install trunk --locked --version 0.21.14

      - name: Build the web app
        # The desktop shell embeds crates/web/dist (frontendDist), so the
        # embedded PWA must be built here with the exact command the pages
        # workflow uses. beforeBuildCommand was removed from tauri.conf.json
        # so `cargo tauri build` embeds THIS build unchanged — a second,
        # divergent trunk run once shipped a stale webview into the
        # installers (v0.4.34: the reload-merge fix was missing, constants
        # vanished on store reloads, and the guide's 3D animation example
        # errored with "unknown name"). The smoke test below verifies the
        # hash made it into the binary.
        run: trunk build --release
        working-directory: crates/web

      - name: Check the on-demand guide files
        # ADR-0053: the guide is not compiled into any binary; the web
        # app fetches guide/<locale>.md from dist, and the installers
        # carry the files as Tauri bundle resources for the TUI.
        shell: bash
        run: |
          set -e
          test -f crates/web/dist/guide/en.md
          test -f crates/web/dist/guide/zh-CN.md
          test "$(ls crates/web/dist/guide/*.md | wc -l)" -eq 8

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build desktop bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: crates/tauri-app/src-tauri

      - name: Build the language server
        # ADR-0066: the shared epher-lsp binary the IDE extensions
        # download on first run. Its version is locked to the release
        # train, so it must report exactly what the CLI reports.
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          cargo build --release -p epher-lsp
          if [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          ./target/release/epher-lsp --version | grep -q "$(echo "$VERSION" | sed 's/^v//')"

      - name: Smoke-test the unified CLI
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/target/release/epher"
          # The same binary the bundle ships: one-shot CLI, bases, graphing.
          if [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          "$BIN" --version | grep -q "$(echo "$VERSION" | sed 's/^v//')"
          [ "$("$BIN" 'hex(255)')" = "0xff" ]
          [ "$("$BIN" '0b1010 + 0o17')" = "25" ]
          OUT="$(mktemp -d)"
          "$BIN" $'graph x^2\ngraph save '"$OUT"'/curves.svg' >/dev/null
          grep -q 'stroke-width: 1.00' "$OUT/curves.svg"
          "$BIN" $'graph3d x^2 - y^2\ngraph3d save '"$OUT"'/surface.svg' >/dev/null
          # The 3D parts markup carries class, points, and the ADR-0055
          # px-width stroke (vector-effect non-scaling-stroke); the exact
          # attribute order is not part of the contract.
          grep -q '<polyline' "$OUT/surface.svg"
          grep -q 'points="' "$OUT/surface.svg"
          grep -q 'vector-effect="non-scaling-stroke"' "$OUT/surface.svg"
          # Transparent exports (ADR-0055): no painted background rect.
          ! grep -q 'class="bg"' "$OUT/curves.svg"
          ! grep -q 'class="bg"' "$OUT/surface.svg"
          # The embedded webview must be THIS run's web build: the asset
          # filename (trunk's content hash) appears verbatim in the binary.
          HASH="$(grep -o 'epher-web-[a-f0-9]*\.js' "$GITHUB_WORKSPACE/crates/web/dist/index.html" | head -1)"
          # strings first, then grep: piping straight into grep -q lets the
          # early exit SIGPIPE the strings process, which macOS reports as
          # a pipeline failure under set -o pipefail.
          strings "$BIN" > "$OUT/strings.txt"
          grep -qF "$HASH" "$OUT/strings.txt"
          echo "embedded web build: $HASH"
          # The guide is not compiled into the binary (ADR-0053): the
          # markdown lives in the dist files and the bundle resources.
          ! grep -q "epher user guide" "$OUT/strings.txt"

      - name: Package bundles
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          BUNDLE="$GITHUB_WORKSPACE/target/release/bundle"
          case "${{ runner.os }}" in
            Linux)
              # The target is already linux-<arch> (linux-x86_64,
              # linux-aarch64) — no extra prefix.
              cp "$BUNDLE"/deb/*.deb artifacts/epher-${{ matrix.target }}.deb
              cp "$BUNDLE"/rpm/*.rpm artifacts/epher-${{ matrix.target }}.rpm
              cp "$BUNDLE"/appimage/*.AppImage artifacts/epher-${{ matrix.target }}.AppImage
              # The TUI reads the guide from the bundle resources
              # (ADR-0053): the deb/rpm must carry the 8 locale files.
              # grep -q closes the pipe on its first match, which SIGPIPEs
              # the listing producer; under pipefail that fails the check
              # even when the file is present, so read via a process
              # substitution whose status is grep's alone.
              grep -q "guide/en.md" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "guide/zh-CN.md" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "guide/en.md" <(rpm -qlp artifacts/epher-${{ matrix.target }}.rpm)
              # ADR-0058: the deb/rpm must also carry the script
              # collection under /usr/lib/epher/scripts — the guide's
              # terminal examples name those installed paths. (The
              # resources-map line was once lost between rounds and a
              # release shipped installers without the scripts.)
              grep -q "scripts/astronomy/moon/full-moons.epher" <(dpkg-deb -c artifacts/epher-${{ matrix.target }}.deb)
              grep -q "scripts/astronomy/moon/full-moons.epher" <(rpm -qlp artifacts/epher-${{ matrix.target }}.rpm)
              # The language server rides the same artifacts dir; both
              # callers attach everything they find there.
              strip target/release/epher-lsp
              gzip -9 -n -c target/release/epher-lsp > artifacts/epher-lsp-${{ matrix.target }}.gz
              ;;
            macOS)
              # Ad-hoc signing (ADR-0058 amendment): a downloaded DMG
              # arrives with the com.apple.quarantine flag, and
              # Gatekeeper's check of a quarantined UNSIGNED bundle fails
              # hard — macOS reports the app as "damaged" with no
              # override. An ad-hoc signature is a valid signature: the
              # check passes and first launch shows the ordinary
              # right-click → Open warning the guide documents.
              APP="$GITHUB_WORKSPACE/target/release/bundle/macos/epher.app"
              test -d "$APP"
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict "$APP"
              # The DMG: volume epher, the app, the Applications symlink
              # — what the tauri dmg bundler lays out, rebuilt here from
              # the SIGNED bundle.
              STAGE="$(mktemp -d)"
              cp -R "$APP" "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              hdiutil create -volname epher -srcfolder "$STAGE" -ov -format UDZO \
                artifacts/epher-${{ matrix.target }}.dmg
              # The shipped DMG itself must verify: the Gatekeeper gate.
              hdiutil attach -nobrowse -readonly artifacts/epher-${{ matrix.target }}.dmg
              VOL="$(ls -d /Volumes/epher* | head -1)"
              codesign --verify --deep --strict "$VOL/epher.app"
              # ADR-0058: the app bundle carries the scripts at
              # Contents/Resources/scripts.
              test -f "$VOL/epher.app/Contents/Resources/scripts/astronomy/moon/full-moons.epher"
              hdiutil detach "$VOL"
              # The language server: stripped, then re-signed ad-hoc
              # (strip drops the linker's signature, and a valid
              # signature keeps any Gatekeeper check overridable, the
              # same policy as the app itself).
              strip target/release/epher-lsp
              codesign --force --sign - target/release/epher-lsp
              codesign --verify target/release/epher-lsp
              gzip -9 -n -c target/release/epher-lsp > artifacts/epher-lsp-${{ matrix.target }}.gz
              ;;
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe artifacts/epher-windows-x86_64.exe
              # ADR-0058: the NSIS installer carries the scripts beside
              # the binaries (%LOCALAPPDATA%\epher\scripts in currentUser
              # mode). 7-Zip lists the archive on the runner.
              7z l artifacts/epher-windows-x86_64.exe | grep -q "full-moons.epher"
              # The language server: a zip with the exe at the archive
              # root, the layout the VS Code downloader's Expand-Archive
              # step expects.
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'target/release/epher-lsp.exe' -DestinationPath 'artifacts/epher-lsp-windows-x86_64.zip' -Force"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  vscode:
    # The VS Code pilot extension (ADR-0066), packaged for the release
    # and the staging draft. Marketplace publication is deliberately
    # out of scope until the extensions are proven: the releases page
    # is the distribution, and the website page links this asset. The
    # version rides the release train: the desktop entry resolves
    # releases/download/v<its own version>/ for the server, so the
    # packaged version must equal what the CLI reports. The web entry
    # (ADR-0066 amendment) needs no download: it runs the same server
    # compiled to wasm32-wasip1-threads, built here from the same
    # commit and shipped inside the vsix.
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - name: Resolve the release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build the wasm server
        shell: bash
        run: |
          set -e
          cargo build -p epher-lsp --target wasm32-wasip1-threads --release
          mkdir -p clients/vscode/server
          cp target/wasm32-wasip1-threads/release/epher-lsp.wasm \
            clients/vscode/server/epher-lsp.wasm
      - name: Build and package
        shell: bash
        run: |
          set -e
          cd clients/vscode
          npm ci --no-audit --no-fund
          # --allow-same-version: a staging build runs against the
          # previous release number, where the bump is a no-op
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          npm run compile
          # --no-dependencies: both entries are bundled and node_modules
          # ships nothing, so npm's dependency scan is skipped. It would
          # otherwise fail on the wasm-wasi-lsp peer pin (a prerelease
          # vscode-languageclient version we intentionally don't ride;
          # see .npmrc).
          npx --yes @vscode/vsce@3.9.2 package --allow-missing-repository \
            --no-dependencies \
            --out epher-vscode.vsix
      - name: Smoke-test the package
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("clients/vscode/epher-vscode.vsix")
          names = z.namelist()
          assert "extension/out/extension.js" in names, sorted(names)[:20]
          assert "extension/dist/browser.js" in names, sorted(names)[:20]
          assert "extension/server/epher-lsp.wasm" in names, sorted(names)[:20]
          # The web entry loads the server by this path; if the name
          # drifts the failure mode is a silent baseline-only web.
          assert b"epher-lsp.wasm" in z.read("extension/dist/browser.js")
          wasm = z.read("extension/server/epher-lsp.wasm")
          assert wasm[:4] == b"\x00asm", "the shipped wasm is not a module"
          print("vsix ok:", len(names), "files, wasm", len(wasm), "bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: clients/vscode/epher-vscode.vsix
          if-no-files-found: error

  jetbrains:
    # The JetBrains plugin (ADR-0066, stage five), packaged for the
    # release and the staging draft alongside the VS Code pilot.
    # Marketplace publication stays out of scope: the website page
    # links the zip and the IDE installs it from disk. Like the vsix,
    # the plugin resolves releases/download/v<its own version>/ for the
    # server, so the packaged version must equal what the CLI reports.
    #
    # The build compiles against IntelliJ IDEA Ultimate 2024.2.4: the
    # platform's LSP client (com.intellij.platform.lsp.api) ships only
    # in the commercial IDEs, so the Community artifact cannot provide
    # the LSP classes. The IDE download is ~1.3 GB, expected. No gradle
    # wrapper is committed; the version is pinned here instead.
    name: jetbrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"
      - name: Resolve the release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build and package
        shell: bash
        run: |
          set -e
          cd clients/jetbrains
          gradle buildPlugin -PpluginVersion="$VERSION"
      - name: Smoke-test the package
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import glob, io, os, zipfile
          version = os.environ["VERSION"]
          zips = glob.glob("clients/jetbrains/build/distributions/*.zip")
          assert len(zips) == 1, zips
          z = zipfile.ZipFile(zips[0])
          names = z.namelist()
          # The plugin descriptor rides inside the plugin jar; find it
          # wherever the packaging laid it down.
          plugin_xml = None
          for jar_name in (n for n in names if n.endswith(".jar")):
              jar = zipfile.ZipFile(io.BytesIO(z.read(jar_name)))
              if "META-INF/plugin.xml" in jar.namelist():
                  plugin_xml = jar.read("META-INF/plugin.xml").decode()
                  break
          assert plugin_xml, "no plugin.xml in any jar of " + zips[0]
          assert "<id>io.epher.jetbrains</id>" in plugin_xml, plugin_xml
          assert f"<version>{version}</version>" in plugin_xml, plugin_xml
          assert "platform.lsp.serverSupportProvider" in plugin_xml, plugin_xml
          assert "textmate.bundleProvider" in plugin_xml, plugin_xml
          jar_names = jar.namelist()
          for resource in ("epher-bundle/package.json",
                           "epher-bundle/syntaxes/epher.tmLanguage",
                           "epher-bundle/language-configuration.json",
                           "liveTemplates/epher.xml"):
              assert resource in jar_names, sorted(jar_names)
          print("jetbrains zip ok:", zips[0], len(names), "files")
          PY
      - name: Copy to the shared artifacts directory
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          cp clients/jetbrains/build/distributions/*.zip artifacts/epher-jetbrains.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: artifacts
          if-no-files-found: error

  visualstudio:
    # The Visual Studio 2022 extension (ADR-0066, stage six), packaged
    # for the release and the staging draft. Like the vsix and the
    # plugin above, it resolves releases/download/v<its own version>/
    # for the server, so the packaged version must equal what the CLI
    # reports; EpherVersion stamps both the manifest and the assembly.
    # Marketplace publication stays out of scope: the website page
    # links the vsix and the IDE installs it from disk.
    #
    # No local build exists for this one (the extension needs Windows
    # and msbuild), so CI is the only verifier; the VsSDK tooling comes
    # from the Microsoft.VSSDK.BuildTools package the project pins, and
    # the runner's VS carries the extension-development workload.
    name: visualstudio extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: microsoft/setup-msbuild@v2
      - name: Resolve the release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build the vsix
        shell: bash
        run: |
          set -e
          # setup-msbuild puts msbuild on PATH when it can; when the
          # runner's Visual Studio moved somewhere it does not expect,
          # resolve the same way the action does, via vswhere.
          if command -v msbuild >/dev/null 2>&1; then
            MSBUILD="msbuild"
          else
            MSBUILD="$(vswhere.exe -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | head -1)"
          fi
          if [ -z "$MSBUILD" ]; then
            echo "::error::msbuild not found"
            exit 1
          fi
          echo "msbuild at: $MSBUILD"
          "$MSBUILD" -restore -nologo \
            -p:Configuration=Release \
            -p:EpherVersion="$VERSION" \
            clients/visualstudio/Epher.VisualStudio.csproj
      - name: Smoke-test the vsix and copy to the shared artifacts directory
        # The vsix is a zip: verify the manifest, the compiled assembly,
        # and the editor assets it must carry, then give it the stable
        # asset name both callers attach.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vsix = "clients/visualstudio/bin/Release/Epher.VisualStudio.vsix"
          if (-not (Test-Path $vsix)) { throw "vsix not found at $vsix" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          if ($names -notcontains "extension.vsixmanifest") { throw "no extension.vsixmanifest in the vsix" }
          if ($names -notcontains "Epher.VisualStudio.dll") { throw "no compiled Epher.VisualStudio.dll in the vsix" }
          if ($names -notcontains "Epher.pkgdef") { throw "no Epher.pkgdef in the vsix" }
          if (-not ($names | Where-Object { $_ -eq "Grammars/epher.tmLanguage" })) { throw "no TextMate grammar in the vsix" }
          if ($names -notcontains "epher-language-configuration.json") { throw "no language configuration in the vsix" }
          # The docs' contract: VS provides the LSP client assemblies
          # from its install directory, the vsix must not carry them.
          if ($names | Where-Object { $_ -eq "Microsoft.VisualStudio.LanguageServer.Client.dll" }) { throw "the vsix packed the LSP client assembly; VS provides it" }
          Write-Host "vsix ok:" $names.Count "files"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $vsix artifacts/epher-visualstudio.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: visualstudio-extension
          path: artifacts
          if-no-files-found: error

  editor-configs:
    # The editor configurations (ADR-0067: Neovim, Vim, and Sublime as
    # configuration, and Zed as a dev extension that ships as source),
    # packaged as stable-named source zips. Nothing here is compiled:
    # Zed compiles its dev extension itself, and the other editors read
    # the files in place. The zed target/ directory (a local build
    # output) and any build output never ride along.
    name: editor configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Package the editor configs
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          for client in zed nvim vim sublime; do
            stage="epher-$client"
            rm -rf "$stage"
            mkdir -p "$stage"
            # Each zip carries the client's files under a top folder
            # named after the client.
            (cd "clients/$client" && tar --exclude=./target --exclude=./*.wasm -cf - .) | tar -xf - -C "$stage"
            rm -f "artifacts/$stage.zip"
            zip -qr "artifacts/$stage.zip" "$stage"
          done
      - name: Smoke-test the packages
        shell: bash
        run: |
          set -e
          unzip -l artifacts/epher-zed.zip | grep -q "epher-zed/extension.toml"
          unzip -l artifacts/epher-nvim.zip | grep -q "epher-nvim/lua/epher.lua"
          unzip -l artifacts/epher-vim.zip | grep -q "epher-vim/syntax/epher.vim"
          unzip -l artifacts/epher-sublime.zip | grep -q "epher-sublime/epher.tmLanguage"
          for z in artifacts/epher-zed.zip artifacts/epher-nvim.zip artifacts/epher-vim.zip artifacts/epher-sublime.zip; do
            unzip -l "$z" | grep -q "README.md"
            echo "$z: $(unzip -l "$z" | tail -1)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: editor-configs
          path: artifacts
          if-no-files-found: error
