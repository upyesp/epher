# Proves the Flathub manifest builds on a real runner (ADR-0061). The
# manifest is the same file Flathub's buildbot compiles; a green run here
# means runtime bumps, rust-stable updates, or dependency drift get caught
# in this repo instead of in the public submission PR.
name: flatpak build

on:
  workflow_dispatch:
  push:
    branches: [staging, main]
    paths:
      - packaging/flatpak/**
      - Cargo.lock
      - crates/**
      - site/icon.svg
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: epher.flatpak
          manifest-path: packaging/flatpak/org.epher.Desktop.yml
