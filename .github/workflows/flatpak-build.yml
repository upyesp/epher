# Proves the Flatpak manifest builds on real runners (ADR-0061). The
# manifest is a fully offline, fully from-source build recipe; a green
# run here means runtime bumps, rust-stable updates, or dependency
# drift get caught in this repo instead of at release time. Flathub
# publication was dropped (ADR-0061 amendment, 2026-09-18); maintaining
# this build is the whole Flatpak story now, and each run leaves the
# bundle as an artifact for direct testing. The bundle is x86_64 only:
# the arm64 proof leg was withdrawn (ADR-0061 amendment, 2026-11-22)
# after the arm runner's flatpak-builder sandbox died reliably with
# bwrap "Exec format error".
name: flatpak build

on:
  workflow_dispatch:
  push:
    branches: [staging, main]
    paths:
      - packaging/flatpak/**
      - Cargo.lock
      - crates/**
      - site/icon.svg
permissions:
  contents: read
concurrency:
  group: flatpak-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flatpak bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        id: build
        # One automatic re-attempt absorbs the runner images' transient
        # flakes (the x86_64 SDK-update "Invalid cross-device link"; the
        # arm bwrap "Exec format error" that killed the withdrawn arm
        # leg entirely — see release.yml).
        continue-on-error: true
        with:
          bundle: epher-linux-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/org.epher.Desktop.yml
          # explicit upload below names the artifact cleanly
          upload-artifact: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: always() && steps.build.outcome == 'failure'
        with:
          bundle: epher-linux-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/org.epher.Desktop.yml
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: epher-linux-${{ matrix.arch }}.flatpak
