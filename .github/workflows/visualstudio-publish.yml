name: visualstudio publish

# The Visual Studio Marketplace channel for the VS IDE extension
# (marketplace.visualstudio.com, target Visual Studio 2022). Builds the
# vsix from this checkout (the server rides inside it) and publishes
# with the SDK's VsixPublisher CLI and an Azure DevOps personal access
# token with the Marketplace: Manage scope (a different mechanism from
# the Entra federated credential the VS Code gallery route needed).
# The token lives in the `stores` environment secret VS_MARKETPLACE_PAT;
# the job skips with a notice until it exists. VsixPublisher overwrites
# a same-version extension, so a failed run can simply be rerun.

on:
  workflow_call:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the caller's ref)"
        type: string
        default: ""
      version:
        description: "extension version without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the default branch)"
        type: string
        default: ""
      version:
        description: "extension version without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"

jobs:
  visualstudio:
    name: publish upyesp.Epher.VisualStudio
    environment: stores
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VSIX: clients/visualstudio/bin/Release/Epher.VisualStudio.vsix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Skip with a notice until VS_MARKETPLACE_PAT exists
        id: gate
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        shell: pwsh
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) {
            Write-Host "::notice::VS_MARKETPLACE_PAT is not set in the stores environment; the Visual Studio Marketplace publish is skipped. Create an Azure DevOps PAT with the Marketplace: Manage scope and add it as the secret to enable this channel."
            "skip=true" >> $env:GITHUB_OUTPUT
          }

      - uses: microsoft/setup-msbuild@v2
        if: steps.gate.outputs.skip != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip != 'true'

      - name: Resolve the extension version
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ] || [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build the bundled server
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          cargo build --release -p epher-lsp
          mkdir -p clients/visualstudio/server
          cp target/release/epher-lsp.exe clients/visualstudio/server/epher-lsp.exe

      - name: Build the vsix
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if command -v msbuild >/dev/null 2>&1; then
            MSBUILD="msbuild"
          else
            MSBUILD="$(vswhere.exe -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | head -1)"
          fi
          if [ -z "$MSBUILD" ]; then
            echo "::error::msbuild not found"
            exit 1
          fi
          "$MSBUILD" -restore -nologo \
            -p:Configuration=Release \
            -p:EpherVersion="$VERSION" \
            clients/visualstudio/Epher.VisualStudio.csproj

      - name: Smoke-test the vsix
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $vsix = "clients/visualstudio/bin/Release/Epher.VisualStudio.vsix"
          if (-not (Test-Path $vsix)) { throw "vsix not found at $vsix" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          foreach ($required in @("extension.vsixmanifest", "Epher.VisualStudio.dll", "Epher.pkgdef", "server/epher-lsp.exe")) {
            if ($names -notcontains $required) { throw "the vsix is missing $required" }
          }
          Write-Host "vsix ok:" $names.Count "files"

      - name: Write overview.md from the listing description
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          # DESCRIPTION.md carries maintainer notes above a --- separator;
          # everything after it is the listing body.
          $lines = Get-Content clients/visualstudio/listing/DESCRIPTION.md
          $cut = ($lines | Select-String -Pattern '^---$' | Select-Object -First 1).LineNumber
          if (-not $cut) { Write-Error "DESCRIPTION.md has no --- separator"; exit 1 }
          $lines[$cut..($lines.Count - 1)] -join "`n" | Set-Content overview.md -Encoding utf8NoBOM

      - name: Write vs-publish.json
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          @{
            "`$schema"    = "http://json.schemastore.org/vsix-publish"
            "categories"  = @("coding", "programming languages")
            "identity"    = @{ internalName = "EpherVisualStudio" }
            "overview"    = "overview.md"
            "priceCategory" = "free"
            "publisher"   = "upyesp"
            "private"     = $false
            "qna"         = $true
            "repo"        = "https://github.com/upyesp/epher"
          } | ConvertTo-Json | Set-Content vs-publish.json -Encoding utf8NoBOM

      - name: Publish with VsixPublisher
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -property installationPath
          if (-not $vsroot) { Write-Error "no Visual Studio installation found by vswhere"; exit 1 }
          $publisher = Join-Path $vsroot "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
          if (-not (Test-Path $publisher)) {
            $publisher = (Get-ChildItem $vsroot -Recurse -Filter VsixPublisher.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $publisher) { Write-Error "VsixPublisher.exe not found under $vsroot"; exit 1 }
          Write-Host "using $publisher"
          & $publisher login -personalAccessToken $env:PAT -publisherName upyesp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $publisher publish -payload $env:VSIX -publishManifest vs-publish.json -personalAccessToken $env:PAT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::notice::published upyesp.Epher.VisualStudio $VERSION to marketplace.visualstudio.com"
