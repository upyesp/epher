name: visualstudio publish

# The Visual Studio Marketplace channel for the VS IDE extension
# (marketplace.visualstudio.com, target Visual Studio 2022). Builds the
# vsix from this checkout (the server rides inside it) and publishes
# with the SDK's VsixPublisher CLI and an Azure DevOps personal access
# token with the Marketplace: Manage scope (a different mechanism from
# the Entra federated credential the VS Code gallery route needed).
# The token lives in the `stores` environment secret VS_MARKETPLACE_PAT;
# the job skips with a notice until it exists. The marketplace rejects
# a same-version upload, so an icon or readme fix rides the next
# version like every other gallery.

on:
  workflow_call:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the caller's ref)"
        type: string
        default: ""
      version:
        description: "extension version without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the default branch)"
        type: string
        default: ""
      version:
        description: "extension version without the leading v (auto = read from crates/cli/Cargo.toml)"
        type: string
        default: "auto"

jobs:
  visualstudio:
    name: publish upyesp.Epher.VisualStudio
    environment: stores
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VSIX: clients/visualstudio/bin/Release/Epher.VisualStudio.vsix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Skip with a notice until VS_MARKETPLACE_PAT exists
        id: gate
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        shell: pwsh
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) {
            Write-Host "::notice::VS_MARKETPLACE_PAT is not set in the stores environment; the Visual Studio Marketplace publish is skipped. Create an Azure DevOps PAT with the Marketplace: Manage scope and add it as the secret to enable this channel."
            "skip=true" >> $env:GITHUB_OUTPUT
          }

      - uses: microsoft/setup-msbuild@v2
        if: steps.gate.outputs.skip != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip != 'true'

      - name: Resolve the extension version
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ] || [ "$VERSION" = "auto" ]; then
            VERSION="$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build the bundled server
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          cargo build --release -p epher-lsp
          mkdir -p clients/visualstudio/server
          cp target/release/epher-lsp.exe clients/visualstudio/server/epher-lsp.exe

      - name: Build the vsix
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if command -v msbuild >/dev/null 2>&1; then
            MSBUILD="msbuild"
          else
            MSBUILD="$(vswhere.exe -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | head -1)"
          fi
          if [ -z "$MSBUILD" ]; then
            echo "::error::msbuild not found"
            exit 1
          fi
          "$MSBUILD" -restore -nologo \
            -p:Configuration=Release \
            -p:EpherVersion="$VERSION" \
            clients/visualstudio/Epher.VisualStudio.csproj

      - name: Smoke-test the vsix
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $vsix = "clients/visualstudio/bin/Release/Epher.VisualStudio.vsix"
          if (-not (Test-Path $vsix)) { throw "vsix not found at $vsix" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $zip.Dispose()
          foreach ($required in @("extension.vsixmanifest", "Epher.VisualStudio.dll", "Epher.pkgdef", "server/epher-lsp.exe", "icon.png")) {
            if ($names -notcontains $required) { throw "the vsix is missing $required" }
          }
          Write-Host "vsix ok:" $names.Count "files"

      - name: Write overview.md from the listing description
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          # DESCRIPTION.md carries maintainer notes above a --- separator;
          # everything after it is the listing body.
          $lines = Get-Content clients/visualstudio/listing/DESCRIPTION.md
          $cut = ($lines | Select-String -Pattern '^---$' | Select-Object -First 1).LineNumber
          if (-not $cut) { Write-Error "DESCRIPTION.md has no --- separator"; exit 1 }
          $lines[$cut..($lines.Count - 1)] -join "`n" | Set-Content overview.md -Encoding utf8NoBOM

      - name: Write vs-publish.json
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          @{
            "`$schema"    = "http://json.schemastore.org/vsix-publish"
            "categories"  = @("coding", "programming languages")
            "identity"    = @{ internalName = "EpherVisualStudio" }
            "overview"    = "overview.md"
            "priceCategory" = "free"
            "publisher"   = "upyesp"
            "private"     = $false
            "qna"         = $true
            "repo"        = "https://github.com/upyesp/epher"
          } | ConvertTo-Json | Set-Content vs-publish.json -Encoding utf8NoBOM

      - name: Publish with VsixPublisher
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          # Runner images move under this job: windows-latest moved from
          # VS 17 to VS 18 mid-train, and the new image's VsixPublisher
          # failed to load its own MSAL (VsixPub0031, Microsoft.Identity
          # .Client binding mismatch). So: try every installed VS
          # instance's VsixPublisher; beside the exe, lay the exact
          # MSAL the binary asks for (fetched from nuget.org); on a
          # binding failure purge stale GAC copies of MSAL (they shadow
          # the app-dir copy for strong-named assemblies) and retry
          # once. The first instance that logs in does the publish.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $instances = & $vswhere -products * -format json | ConvertFrom-Json |
            Sort-Object { [version]$_.installationVersion }
          if (-not $instances) { Write-Error "no Visual Studio installation found by vswhere"; exit 1 }

          function Ensure-Msal([string]$binDir) {
            $msal = Join-Path $binDir "Microsoft.Identity.Client.dll"
            if (Test-Path $msal) { return }
            $zip = Join-Path $env:RUNNER_TEMP "msal.zip"
            foreach ($v in @("4.85.2.0", "4.85.2")) {
              try {
                Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Identity.Client/$v" -OutFile $zip
                Expand-Archive $zip (Join-Path $env:RUNNER_TEMP "msal") -Force
                $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP "msal") -Recurse -Filter Microsoft.Identity.Client.dll |
                  Where-Object { $_.FullName -match "net4[578]" } | Select-Object -First 1
                if ($dll) { Copy-Item $dll.FullName $binDir; Write-Host "placed MSAL $v beside the publisher"; return }
              } catch { Write-Host "msal $v fetch failed: $_" }
            }
            Write-Host "no MSAL placed; proceeding with the installation's own"
          }

          function Clear-GacMsal {
            Get-ChildItem "C:\Windows\Microsoft.NET\assembly" -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "microsoft.identity.client" } |
              ForEach-Object { Write-Host "purging GAC copy $($_.FullName)"; Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          }

          $chosen = $null
          foreach ($instance in $instances) {
            $vsroot = $instance.installationPath
            $publisher = Join-Path $vsroot "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
            if (-not (Test-Path $publisher)) {
              $publisher = (Get-ChildItem $vsroot -Recurse -Filter VsixPublisher.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            }
            if (-not $publisher) { continue }
            Write-Host "trying $publisher (VS $($instance.installationVersion))"
            Ensure-Msal (Split-Path $publisher)
            & $publisher login -personalAccessToken $env:PAT -publisherName upyesp
            if ($LASTEXITCODE -eq 0) { $chosen = $publisher; break }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "login failed (exit $LASTEXITCODE); purging GAC MSAL copies and retrying once"
              Clear-GacMsal
              & $publisher login -personalAccessToken $env:PAT -publisherName upyesp
              if ($LASTEXITCODE -eq 0) { $chosen = $publisher; break }
            }
          }
          if (-not $chosen) { Write-Error "no Visual Studio instance could log in to the marketplace"; exit 1 }
          Write-Host "using $chosen"
          & $chosen publish -payload $env:VSIX -publishManifest vs-publish.json -personalAccessToken $env:PAT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::notice::published upyesp.Epher.VisualStudio $VERSION to marketplace.visualstudio.com"
