# JVM arguments for the Gradle daemon: the IntelliJ Platform build
# downloads and unpacks a full IDE, so give the daemon room to work.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Do not bundle a second kotlin-stdlib into the plugin: every JetBrains
# IDE carries the stdlib the plugin runs against. The compile classpath
# still gets one via an explicit compileOnly dependency.
kotlin.stdlib.default.dependency=false
