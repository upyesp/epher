# The Zed extension manifest. The language directory (languages/epher)
# registers the epher language; this table binds the shared language
# server to it. The languages list matches the `name` field in
# languages/epher/config.toml, not the directory name.
#
# The version is locked to epher's 0.5.x train (ADR-0066): the Rust
# crate reads its own version at compile time and downloads the
# matching epher-lsp release, so these two versions must move
# together. Bump this file and Cargo.toml in the same commit.
id = "epher"
name = "epher"
version = "0.5.50"
schema_version = 1
authors = ["upyesp"]
description = "epher in Zed: live diagnostics, inline answers, hover signatures, completion, and unit-aware coloring from the shared epher language server."
repository = "https://github.com/upyesp/epher"

# No tree-sitter grammar ships here, on purpose. Checked against
# zed's source (crates/extension/src/extension_builder.rs): any
# [grammars.*] entry makes a dev-extension install resolve the
# wasi-sdk toolchain (download or WASI_SDK_PATH) BEFORE it ever
# looks at a prebuilt grammars/<name>.wasm, so in sandboxed
# environments (Flatpak, stripped Windows PATHs) the whole install
# fails with ENOENT — the 0.5.47 field report. A grammar absent
# from the manifest is never loaded, so there is no prebuilt-only
# path for dev extensions. The grammar returns only with
# marketplace publication: registry installs download a finished
# package (no toolchain on the user's machine), and the packaging
# CLI takes grammars/<name>.wasm straight from this directory —
# an epher CI job can compile it once from upyesp/tree-sitter-epher
# at the pinned rev. Until then the coloring rides the language
# server's semantic tokens, which Zed ships DISABLED by default
# ("semantic_tokens" defaults to "off"), so turning them on is
# part of installing — the README steps and the website card both
# carry the setting.

[language_servers.epher-lsp]
name = "epher"
languages = ["epher"]
