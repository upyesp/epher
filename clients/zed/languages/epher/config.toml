# The epher language for Zed. The shared tree-sitter grammar (see
# extension.toml) colors the language out of the box; Zed ships
# semantic tokens disabled by default ("semantic_tokens" defaults to
# "off"), so the unit-aware refinement and the inline answers stay off
# until the user turns them on:
#
#   "languages": { "epher": { "semantic_tokens": "full" } }
#
# semantic_token_rules.json styles the custom `unit` token type.
#
# block_comment must be ONE table ({ start = …, prefix = …, end = …,
# tab_size = … }) or the old two-string form ([start, end]) — never a
# list of tables. Zed's BlockCommentConfig has no list variant on any
# version (checked 0.204.2 through 1.21.0), and one bad line here
# makes the whole extension vanish at index time: the language and
# the extension itself silently fail to register (a log-only TOML
# parse error is the only trace).
name = "epher"
grammar = "epher"
path_suffixes = ["epher"]
line_comments = ["# ", "// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 0 }
autoclose_before = "}])\"'"
word_characters = ["_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]

increase_indent_pattern = "\\b(then|else|do)$"
decrease_indent_pattern = "^(end|else)\\b"
