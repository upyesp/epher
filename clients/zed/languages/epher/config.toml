# The epher language for Zed. There is no tree-sitter grammar (see
# extension.toml), and Zed ships semantic tokens disabled by default
# ("semantic_tokens" defaults to "off"): a fresh install colors
# nothing until the user turns them on — for any coloring, not just
# units:
#
#   "languages": { "epher": { "semantic_tokens": "full" } }
#
# semantic_token_rules.json styles the custom `unit` token type.
name = "epher"
path_suffixes = ["epher"]
line_comments = ["# ", "// "]
block_comment = [
  { start = "/*", prefix = "", end = "*/", tab_size = 0 },
]
autoclose_before = "}])\"'"
word_characters = ["_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]

increase_indent_pattern = "\\b(then|else|do)$"
decrease_indent_pattern = "^(end|else)\\b"
