# The epher language for Zed. The tree-sitter grammar (pinned in
# extension.toml) gives baseline highlighting, outline, and bracket
# matching over the syntax tree; the language server's semantic tokens
# refine the coloring live. Users who want the server's exact unit
# coloring (including `m` versus a variable named m) enable it once:
#
#   "languages": { "epher": { "semantic_tokens": "full" } }
#
# semantic_token_rules.json styles the custom `unit` token type.
name = "epher"
grammar = "epher"
path_suffixes = ["epher"]
line_comments = ["# ", "// "]
block_comment = [
  { start = "/*", prefix = "", end = "*/", tab_size = 0 },
]
autoclose_before = "}])\"'"
word_characters = ["_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]

increase_indent_pattern = "\\b(then|else|do)$"
decrease_indent_pattern = "^(end|else)\\b"
